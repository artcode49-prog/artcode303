name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # macOS: Universal Binary (arm64 + x86_64) VST3
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B Build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build Build --config Release -j3

      - name: DSP self test
        run: ./Build/Release/tb303_render selftest

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Acid303-macOS-VST3
          path: Build/Acid303_artefacts/Release/VST3/Acid303.vst3

  # ---------------------------------------------------------------------------
  # Windows: x64 VST3 (MSVC)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B Build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build Build --config Release --parallel

      - name: DSP self test
        run: .\Build\Release\tb303_render.exe selftest

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Acid303-Windows-VST3
          path: Build/Acid303_artefacts/Release/VST3/Acid303.vst3
