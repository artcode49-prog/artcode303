name: build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # macOS: Universal Binary (arm64 + x86_64) VST3
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B Build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build Build --config Release -j3

      - name: DSP self test
        run: ./Build/Release/tb303_render selftest

      # Bundle the AGPL license + a source pointer next to the plugin so the
      # distributed binary carries the license text (AGPLv3 section 4) and
      # tells users where the Corresponding Source lives (section 6 / 13).
      - name: Package VST3
        run: |
          set -e
          printf '%s\n' \
            'ACID-303 (VST3) - Corresponding Source' \
            '======================================' \
            '' \
            'Licensed under the GNU Affero General Public License v3.0 or later.' \
            'See LICENSE for the full text.' \
            '' \
            'Corresponding source: https://github.com/artcode49-prog/artcode303' \
            '' \
            'SPDX-License-Identifier: AGPL-3.0-or-later' > SOURCE.txt
          mkdir -p pkgstage
          cp -R Build/Acid303_artefacts/Release/VST3/Acid303.vst3 pkgstage/
          cp LICENSE SOURCE.txt pkgstage/
          rm -f Acid303-macOS-VST3.zip
          ( cd pkgstage && zip -r -y -q "$GITHUB_WORKSPACE/Acid303-macOS-VST3.zip" Acid303.vst3 LICENSE SOURCE.txt )
          echo "--- zip contents ---"
          unzip -l Acid303-macOS-VST3.zip

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: Acid303-macOS-VST3
          path: Acid303-macOS-VST3.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: x64 VST3 (MSVC)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B Build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build Build --config Release --parallel

      - name: DSP self test
        run: .\Build\Release\tb303_render.exe selftest

      - name: Package VST3
        shell: pwsh
        run: |
          $lines = @(
            'ACID-303 (VST3) - Corresponding Source',
            '======================================',
            '',
            'Licensed under the GNU Affero General Public License v3.0 or later.',
            'See LICENSE for the full text.',
            '',
            'Corresponding source: https://github.com/artcode49-prog/artcode303',
            '',
            'SPDX-License-Identifier: AGPL-3.0-or-later'
          )
          $lines | Set-Content -Encoding utf8 SOURCE.txt
          Remove-Item -Force Acid303-Windows-VST3.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path 'Build\Acid303_artefacts\Release\VST3\Acid303.vst3','LICENSE','SOURCE.txt' -DestinationPath 'Acid303-Windows-VST3.zip'
          Write-Host '--- zip contents ---'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\Acid303-Windows-VST3.zip")
          $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: Acid303-Windows-VST3
          path: Acid303-Windows-VST3.zip
          if-no-files-found: error
